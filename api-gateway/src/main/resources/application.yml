server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # The frontend only ever needs to know about this one base URL (http://localhost:8080).
      # Each route below picks a request apart by its path prefix and forwards it to whichever
      # backend service actually owns that data -- the frontend never needs to know that
      # "orders" and "stock" live in two entirely different services on two different ports.
      # order.service.url / inventory.service.url default to localhost for local dev (where
      # every service runs directly on the host, each on its own port) but are overridden by
      # the ORDER_SERVICE_URL / INVENTORY_SERVICE_URL env vars in docker-compose.prod.yml --
      # inside Docker Compose, containers reach each other by service name, not "localhost"
      # (each container has its own network namespace; "localhost" there means itself).
      routes:
        - id: order-service-orders
          uri: ${order.service.url:http://localhost:8081}
          predicates:
            - Path=/orders/**

        - id: order-service-users
          uri: ${order.service.url:http://localhost:8081}
          predicates:
            - Path=/users/**

        - id: order-service-products
          uri: ${order.service.url:http://localhost:8081}
          predicates:
            - Path=/products/**

        - id: inventory-service-stock-read
          uri: ${inventory.service.url:http://localhost:8082}
          predicates:
            - Path=/stock/**
            - Method=GET

        # Now reachable through the Gateway again (Phase 3 hid it entirely instead of
        # authorizing it -- Phase 4 does this properly with a real group check in
        # SecurityConfig, so "hidden route" is no longer the only line of defense here).
        - id: inventory-service-stock-restock
          uri: ${inventory.service.url:http://localhost:8082}
          predicates:
            - Path=/stock/*/restock
            - Method=POST

      # CORS lives here, once, instead of being duplicated on every backend service -- the
      # browser only ever talks to this gateway directly, so this is the only place it matters.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

  security:
    oauth2:
      resourceserver:
        jwt:
          # Spring Security fetches <issuer-uri>/.well-known/openid-configuration at startup,
          # follows it to Cognito's JWKS endpoint (its public signing keys), and uses those to
          # verify every incoming token's signature -- no key ever hardcoded here.
          issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.eu-west-1.amazonaws.com/eu-west-1_184lqspmP}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO

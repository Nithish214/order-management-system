# Runs Order Service as a pod inside Minikube. Step 3 of Phase 5A: pointed at the real
# RDS Postgres instance from Phase 3 (made PubliclyAccessible + security-group-opened to
# this machine's IP specifically for this) rather than a local Postgres StatefulSet --
# reuses real data/schema, no second database to keep in sync. KAFKA_BOOTSTRAP_SERVERS
# below points at "kafka:9092", the in-cluster Service created later in this same step.
# Hardcoded env vars are still deliberate here -- ConfigMaps/Secrets are their own
# later step.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DB_HOST
              value: "order-management-db.cfg4uao4qotf.eu-west-1.rds.amazonaws.com"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "orderdb"
            - name: DB_USERNAME
              value: "orderadmin"
            - name: DB_PASSWORD
              # Redacted before committing -- fill in your real RDS password locally when
              # testing (never commit the real value). Replaced by a real Secret in a later
              # step; this file is only safe to commit with a placeholder here.
              value: "REPLACE_WITH_REAL_RDS_PASSWORD"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: JAVA_OPTS
              value: "-Xmx256m"

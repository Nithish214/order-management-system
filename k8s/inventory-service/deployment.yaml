# Same shape as ../order-service/deployment.yaml -- same RDS instance, own database
# (inventorydb) rather than a genuinely separate RDS instance. A separate instance only
# earns its cost once you need independent scaling/backups/blast-radius isolation
# between the two services, none of which apply here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: inventory-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DB_HOST
              value: "order-management-db.cfg4uao4qotf.eu-west-1.rds.amazonaws.com"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "inventorydb"
            - name: DB_USERNAME
              value: "orderadmin"
            - name: DB_PASSWORD
              # Redacted before committing -- see ../order-service/deployment.yaml's comment.
              value: "REPLACE_WITH_REAL_RDS_PASSWORD"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: JAVA_OPTS
              value: "-Xmx256m"

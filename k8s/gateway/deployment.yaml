# The one Deployment in this cluster whose Service is meant to be reachable from
# outside (see ./service.yaml's type: NodePort) -- everything else stays ClusterIP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: api-gateway:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            # Kubernetes Service names resolve via cluster DNS, same principle as
            # Docker Compose's service-name resolution -- "order-service"/
            # "inventory-service" here are exactly the Service names created earlier.
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8081"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:8082"
            - name: COGNITO_ISSUER_URI
              value: "https://cognito-idp.eu-west-1.amazonaws.com/eu-west-1_184lqspmP"
            - name: JAVA_OPTS
              value: "-Xmx256m"

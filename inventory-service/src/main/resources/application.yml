server:
  port: 8082

spring:
  # Local dev now runs against the postgres container in docker-compose.yml
  # (inventorydb -- see docker/postgres-init) instead of the old Oracle XE container.
  # Same defaults pattern as Order Service's identical change: ${DB_USERNAME:postgres}
  # falls back to postgres only when DB_USERNAME isn't set, which is what lets
  # docker-compose.prod.yml override every one of these for the real RDS connection.
  #
  # Port defaults to 5433, not Postgres's usual 5432 -- see docker-compose.yml's postgres
  # service comment: that's the HOST port it publishes on, specifically to avoid
  # colliding with a native Postgres install that might already own 5432 on this
  # machine. The container's own internal port is still the normal 5432.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:inventorydb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    org.hibernate.SQL: INFO
    com.learn.inventoryservice.controller.StockController: DEBUG
  pattern:
    # Same idiom as Order Service's identical addition -- see that file's comment.
    level: "%5p [%X{correlationId:-}]"

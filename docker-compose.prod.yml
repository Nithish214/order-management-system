version: '3.9'

# Runs on the EC2 instance. Unlike docker-compose.yml (local dev: just Oracle), this brings
# up the whole application -- Kafka plus all 4 services -- since Postgres now lives on RDS,
# outside Docker entirely. RDS_HOST/RDS_USERNAME/RDS_PASSWORD come from a .env file that
# lives only on the EC2 instance and is NOT committed to git (see DEPLOYMENT.md) -- Docker
# Compose reads .env automatically for the ${...} substitutions below.
#
# Memory is kept conservative throughout, though less critically than before: this runs on
# a t3.small (2GB RAM) as of the Redpanda migration -- upgraded from a t3.micro (1GB) after
# directly proving, via Kafka's own GC log, multi-second stop-the-world pauses under memory
# pressure. Redpanda (below) replaces Kafka specifically to remove the JVM/GC-pause class of
# problem entirely; the 4 Spring Boot services (Order, Inventory, Payment, Gateway) are
# still JVMs and still benefit from the extra headroom. See DEPLOYMENT.md for the swap
# file, still kept as a safety net.

# Docker's default json-file log driver has NO size limit at all -- left unbounded, a
# sustained burst of traffic (a load test, or just real usage growing) writes log lines
# forever until the disk fills up completely. That's exactly what happened here once: the
# disk hit 0 bytes free mid-load-test, which tripped every service's own disk-space health
# check, which triggered autoheal to restart containers into a still-full disk -- corrupting
# several images in the process. This caps every container's logs at 10MB x 3 rotated
# files (~30MB max, oldest discarded first) so a busy period can never fill the disk via
# logs again, regardless of how much traffic the app sees.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Cache-aside layer in front of Inventory Service's read-heavy product endpoints. No
  # volume, unlike Kafka's implicit log storage or RDS -- a cache is, by definition, just
  # a copy of data that already lives durably somewhere else (Postgres, here). Losing it
  # on a container restart costs nothing but a handful of cold reads that immediately
  # repopulate it from the database -- there's no real data to lose, so there's nothing
  # worth the complexity of persisting.
  #
  # No `ports:` mapping -- deliberately not reachable from outside Docker's internal
  # network at all, not even bound to the host. Redis has NO AUTHENTICATION by default:
  # anyone who could reach port 6379 could read every cached value, or worse, use
  # well-documented exploits against open Redis instances (e.g. abusing CONFIG SET to
  # write an SSH key to disk) to get a foothold on the box entirely. Keeping it off the
  # public internet isn't just good hygiene here, it's the *only* thing standing between
  # "cache" and "open door" -- there's no password to fall back on.
  redis:
    image: redis:7-alpine
    container_name: redis
    # A resource-constrained t3.micro deserves a hard ceiling on any new memory consumer,
    # not just trust that a handful of small product JSON blobs will always stay small.
    # allkeys-lru: once that ceiling is hit, evict the least-recently-used key to make
    # room, rather than erroring out -- exactly the right failure mode for a cache (a
    # forced-early miss is harmless; refusing writes wouldn't be) as opposed to a
    # datastore, where silently discarding data would be a real problem.
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    logging: *default-logging

  # Speaks the exact same wire protocol as Kafka -- order-service/inventory-service's
  # Kafka clients (KafkaTemplate, @KafkaListener, topics, consumer groups, everything)
  # don't know or care that this isn't actually Apache Kafka. The reason for the swap:
  # Kafka runs on a JVM with a garbage collector, and we directly proved (via its own GC
  # log) multi-second "stop the world" pauses under memory pressure -- entire seconds
  # where the broker froze completely mid-request. Redpanda is written in C++ with no
  # JVM and no garbage collector at all, so that specific class of failure structurally
  # can't happen here, regardless of how tight memory gets.
  #
  # No KRaft/ZooKeeper-style config needed -- Redpanda has its own built-in consensus
  # mechanism (Raft) for a single node, nothing extra to configure for that.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=256M
      - --reserve-memory=0M
      # Tells Redpanda not to try to pin/reserve huge amounts of hugepages/CPU the way
      # it would on a dedicated production server -- the correct mode for a small,
      # resource-constrained single-node dev/learning setup like this one.
      - --overprovisioned
      - --node-id=0
      - --check=false
      # Same principle as Kafka's old KAFKA_ADVERTISED_LISTENERS: bind internally on all
      # interfaces, but tell clients to reconnect via the Docker Compose service name.
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
    restart: unless-stopped
    logging: *default-logging

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    depends_on:
      - redpanda
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${RDS_HOST}
      DB_PORT: 5432
      DB_NAME: orderdb
      DB_USERNAME: ${RDS_USERNAME}
      DB_PASSWORD: ${RDS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      JAVA_OPTS: "-Xmx140m"
      # Order status notification emails (OrderNotificationEmailService). Not a secret --
      # it's a verified SES sender identity, same "safe to hardcode" reasoning as
      # COGNITO_CLIENT_ID below. Currently in SES sandbox mode: only verified recipient
      # addresses actually receive anything until AWS approves production access.
      NOTIFICATIONS_FROM_EMAIL: ramesh97908@gmail.com
    ports:
      - "8081:8081"
    restart: unless-stopped
    logging: *default-logging
    # Reports this container's status as healthy/unhealthy in `docker ps`/`docker inspect` --
    # on its own this does NOT make Docker restart anything (that's a Swarm-only behavior);
    # see the autoheal service below, which is what actually acts on this. start_period gives
    # the JVM room to finish booting (Flyway, Hibernate, Kafka consumer setup) before a slow
    # startup counts as a failure.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    depends_on:
      - redpanda
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${RDS_HOST}
      DB_PORT: 5432
      # Separate database on the same RDS instance -- keeps this service's data isolated
      # from Order Service's, same reasoning as the separate Oracle users used locally,
      # without needing (and paying for) a second RDS instance.
      DB_NAME: inventorydb
      DB_USERNAME: ${RDS_USERNAME}
      DB_PASSWORD: ${RDS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # "redis" resolves via Compose's embedded DNS to the redis service above, same
      # principle as "kafka" resolving to the Kafka broker -- no host port needed for
      # this container-to-container hop.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JAVA_OPTS: "-Xmx140m"
    ports:
      - "8082:8082"
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Pure Kafka consumer/producer -- reacts to inventory.reserved, publishes
  # payment.completed/payment.failed. No SPRING_PROFILES_ACTIVE: this service is
  # Postgres-only from day one, unlike Order/Inventory Service's Oracle-vs-Postgres
  # profile split. Not routed through api-gateway at all -- it has no REST API for the
  # frontend to call, so it's not in api-gateway's depends_on either.
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    depends_on:
      - redpanda
    environment:
      DB_HOST: ${RDS_HOST}
      DB_PORT: 5432
      # Separate database on the same RDS instance, same isolation reasoning as
      # inventorydb/orderdb -- see paymentdb's creation in DEPLOYMENT.md.
      DB_NAME: paymentdb
      DB_USERNAME: ${RDS_USERNAME}
      DB_PASSWORD: ${RDS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      JAVA_OPTS: "-Xmx140m"
    ports:
      - "8083:8083"
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    depends_on:
      - order-service
      - inventory-service
      - redis
    environment:
      # Docker Compose service names resolve via its embedded DNS -- this is what makes
      # "order-service" a valid hostname here, unlike on your local machine.
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      # Backs the order-creation rate limiter's token-bucket counters (RequestRateLimiter
      # filter, application.yml) -- the same Redis instance inventory-service already
      # caches against, not a second one.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      # Backs the BFF (AuthController/CognitoAuthClient) -- login/refresh now happen
      # server-side here instead of the browser calling Cognito directly, so the refresh
      # token it returns can be held in an HttpOnly cookie instead of thrown away. None
      # of these are secrets (the app client has no client secret), same as the frontend
      # .env values they mirror -- hardcoded directly for the same reason JAVA_OPTS is.
      COGNITO_REGION: eu-west-1
      COGNITO_CLIENT_ID: 48v29rgvebkkaj46cjuo4vqjb5
      # Same "not a secret" reasoning as COGNITO_CLIENT_ID above -- this is the public
      # Hosted UI domain the browser itself gets redirected to during Google sign-in.
      COGNITO_DOMAIN: https://nithish-ordermgmt-auth.auth.eu-west-1.amazoncognito.com
      # Exact origin(s) the frontend is served from -- required now that /auth/login and
      # /auth/refresh use a credentialed (cookie-carrying) cross-site request; CORS
      # forbids "*" once allowCredentials(true) is in play. See SecurityConfig.
      ALLOWED_ORIGINS: https://dgzc0rv8gh9y.cloudfront.net
      JAVA_OPTS: "-Xmx90m"
    ports:
      - "8080:8080"
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Plain Docker (unlike Swarm) never acts on a container's healthcheck status by itself --
  # it only ever reports "unhealthy" in docker ps/inspect and otherwise does nothing. This is
  # the piece that actually closes the loop: watches every container's health status via the
  # Docker socket, and `docker kill`s any container reporting unhealthy, which then triggers
  # that container's own `restart: unless-stopped` policy to bring it back up fresh. This is
  # specifically for "alive but stuck" (a JVM wedged under memory pressure, still running,
  # never actually crashing on its own) -- restart policies alone only ever catch an outright
  # crash.
  #
  # Mounting the Docker socket gives this container real control over every other container
  # on the host -- a genuine, standard tradeoff for this exact pattern (autoheal is a small,
  # single-purpose, widely-used image with no exposed ports of its own), not something to
  # wave away, but reasonable here for the actual capability it buys.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *default-logging

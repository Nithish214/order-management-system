version: '3.9'

# Runs on the EC2 instance. Unlike docker-compose.yml (local dev: just Oracle), this brings
# up the whole application -- Kafka plus all 3 services -- since Postgres now lives on RDS,
# outside Docker entirely. RDS_HOST/RDS_USERNAME/RDS_PASSWORD come from a .env file that
# lives only on the EC2 instance and is NOT committed to git (see DEPLOYMENT.md) -- Docker
# Compose reads .env automatically for the ${...} substitutions below.
#
# Memory is deliberately conservative throughout: a t3.micro has only 1GB of RAM total for
# 4 JVMs (Kafka + 3 Spring Boot apps) plus the OS itself. See DEPLOYMENT.md for why a swap
# file is also recommended as a safety net against OOM kills.

services:
  # Cache-aside layer in front of Inventory Service's read-heavy product endpoints. No
  # volume, unlike Kafka's implicit log storage or RDS -- a cache is, by definition, just
  # a copy of data that already lives durably somewhere else (Postgres, here). Losing it
  # on a container restart costs nothing but a handful of cold reads that immediately
  # repopulate it from the database -- there's no real data to lose, so there's nothing
  # worth the complexity of persisting.
  #
  # No `ports:` mapping -- deliberately not reachable from outside Docker's internal
  # network at all, not even bound to the host. Redis has NO AUTHENTICATION by default:
  # anyone who could reach port 6379 could read every cached value, or worse, use
  # well-documented exploits against open Redis instances (e.g. abusing CONFIG SET to
  # write an SSH key to disk) to get a foothold on the box entirely. Keeping it off the
  # public internet isn't just good hygiene here, it's the *only* thing standing between
  # "cache" and "open door" -- there's no password to fall back on.
  redis:
    image: redis:7-alpine
    container_name: redis
    # A resource-constrained t3.micro deserves a hard ceiling on any new memory consumer,
    # not just trust that a handful of small product JSON blobs will always stay small.
    # allkeys-lru: once that ceiling is hit, evict the least-recently-used key to make
    # room, rather than erroring out -- exactly the right failure mode for a cache (a
    # forced-early miss is harmless; refusing writes wouldn't be) as opposed to a
    # datastore, where silently discarding data would be a real problem.
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Advertise the Docker Compose service name, not localhost -- this is what the app
      # containers actually resolve via Docker's embedded DNS to reach this broker.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Kafka's default is 50 partitions for its internal __consumer_offsets topic -- sized for
      # real production clusters, wildly oversized for one single-broker learning setup. Each
      # partition costs the log-cleaner memory during startup; this was a real contributor to
      # an OutOfMemoryError we hit, not just the heap size below.
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 3
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_HEAP_OPTS: "-Xmx320m -Xms320m"
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    depends_on:
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${RDS_HOST}
      DB_PORT: 5432
      DB_NAME: orderdb
      DB_USERNAME: ${RDS_USERNAME}
      DB_PASSWORD: ${RDS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: "-Xmx140m"
    ports:
      - "8081:8081"
    restart: unless-stopped
    # Reports this container's status as healthy/unhealthy in `docker ps`/`docker inspect` --
    # on its own this does NOT make Docker restart anything (that's a Swarm-only behavior);
    # see the autoheal service below, which is what actually acts on this. start_period gives
    # the JVM room to finish booting (Flyway, Hibernate, Kafka consumer setup) before a slow
    # startup counts as a failure.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    depends_on:
      - kafka
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${RDS_HOST}
      DB_PORT: 5432
      # Separate database on the same RDS instance -- keeps this service's data isolated
      # from Order Service's, same reasoning as the separate Oracle users used locally,
      # without needing (and paying for) a second RDS instance.
      DB_NAME: inventorydb
      DB_USERNAME: ${RDS_USERNAME}
      DB_PASSWORD: ${RDS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # "redis" resolves via Compose's embedded DNS to the redis service above, same
      # principle as "kafka" resolving to the Kafka broker -- no host port needed for
      # this container-to-container hop.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JAVA_OPTS: "-Xmx140m"
    ports:
      - "8082:8082"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    depends_on:
      - order-service
      - inventory-service
    environment:
      # Docker Compose service names resolve via its embedded DNS -- this is what makes
      # "order-service" a valid hostname here, unlike on your local machine.
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      JAVA_OPTS: "-Xmx90m"
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Plain Docker (unlike Swarm) never acts on a container's healthcheck status by itself --
  # it only ever reports "unhealthy" in docker ps/inspect and otherwise does nothing. This is
  # the piece that actually closes the loop: watches every container's health status via the
  # Docker socket, and `docker kill`s any container reporting unhealthy, which then triggers
  # that container's own `restart: unless-stopped` policy to bring it back up fresh. This is
  # specifically for "alive but stuck" (a JVM wedged under memory pressure, still running,
  # never actually crashing on its own) -- restart policies alone only ever catch an outright
  # crash.
  #
  # Mounting the Docker socket gives this container real control over every other container
  # on the host -- a genuine, standard tradeoff for this exact pattern (autoheal is a small,
  # single-purpose, widely-used image with no exposed ports of its own), not something to
  # wave away, but reasonable here for the actual capability it buys.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

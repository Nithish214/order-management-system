version: '3.9'

# Runs on the EC2 instance. Unlike docker-compose.yml (local dev: just Oracle), this brings
# up the whole application -- Kafka plus all 3 services -- since Postgres now lives on RDS,
# outside Docker entirely. RDS_HOST/RDS_USERNAME/RDS_PASSWORD come from a .env file that
# lives only on the EC2 instance and is NOT committed to git (see DEPLOYMENT.md) -- Docker
# Compose reads .env automatically for the ${...} substitutions below.
#
# Memory is deliberately conservative throughout: a t3.micro has only 1GB of RAM total for
# 4 JVMs (Kafka + 3 Spring Boot apps) plus the OS itself. See DEPLOYMENT.md for why a swap
# file is also recommended as a safety net against OOM kills.

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Advertise the Docker Compose service name, not localhost -- this is what the app
      # containers actually resolve via Docker's embedded DNS to reach this broker.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_HEAP_OPTS: "-Xmx220m -Xms220m"
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-service
    depends_on:
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${RDS_HOST}
      DB_PORT: 5432
      DB_NAME: orderdb
      DB_USERNAME: ${RDS_USERNAME}
      DB_PASSWORD: ${RDS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: "-Xmx140m"
    ports:
      - "8081:8081"
    restart: unless-stopped

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    depends_on:
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${RDS_HOST}
      DB_PORT: 5432
      # Separate database on the same RDS instance -- keeps this service's data isolated
      # from Order Service's, same reasoning as the separate Oracle users used locally,
      # without needing (and paying for) a second RDS instance.
      DB_NAME: inventorydb
      DB_USERNAME: ${RDS_USERNAME}
      DB_PASSWORD: ${RDS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: "-Xmx140m"
    ports:
      - "8082:8082"
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    depends_on:
      - order-service
      - inventory-service
    environment:
      # Docker Compose service names resolve via its embedded DNS -- this is what makes
      # "order-service" a valid hostname here, unlike on your local machine.
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      JAVA_OPTS: "-Xmx70m"
    ports:
      - "8080:8080"
    restart: unless-stopped

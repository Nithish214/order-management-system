server:
  port: 8081

spring:
  # Local dev now runs against the postgres container in docker-compose.yml (orderdb --
  # see docker/postgres-init) instead of the old Oracle XE container. Same defaults
  # pattern as before: ${DB_USERNAME:postgres} means "use env var DB_USERNAME if set,
  # else fall back to postgres" -- lets docker-compose.prod.yml override every one of
  # these via env vars for the real RDS connection without a separate profile file
  # needing to repeat them.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orderdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer


# Backs ProductImageUploadService's presigned S3 URLs. The bucket is the same one already
# hosting the frontend (see scripts/config.ps1's $FrontendBucket) -- reusing it means no
# new bucket, no new CloudFront distribution, and (per that bucket's existing policy)
# anything written under product-images/ is immediately servable at this same CDN domain.
# None of these are secrets -- the bucket name and CDN domain are already public (anyone
# can see them just by loading the site), same reasoning as the Cognito issuer-uri default.
aws:
  region: ${AWS_REGION:eu-west-1}

products:
  image-bucket: ${PRODUCT_IMAGE_BUCKET:order-management-frontend-244689414185}
  image-cdn-domain: ${PRODUCT_IMAGE_CDN_DOMAIN:dgzc0rv8gh9y.cloudfront.net}

logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
  pattern:
    # %5p is Spring Boot's own default for this exact slot -- appending the correlation
    # id here (rather than replacing the whole pattern) means every other part of the
    # default log line format is untouched. %X{correlationId:-} reads the MDC key
    # CorrelationIdFilter sets; the :- means "print nothing" instead of "print the
    # literal text null" for the rare log line that runs before any filter/listener has
    # set it (an @PostConstruct at startup, say).
    level: "%5p [%X{correlationId:-}]"

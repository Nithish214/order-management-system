version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: order-redis
    ports:
      - "6379:6379"

  # Replaces the old Oracle XE container -- local dev now runs against the same
  # database engine as production (RDS Postgres), just a plain container instead of a
  # managed instance. One Postgres server, two separate databases (orderdb, inventorydb)
  # created by docker/postgres-init below -- mirrors docker-compose.prod.yml's "one RDS
  # instance, two databases" pattern rather than needing two containers.
  postgres:
    image: postgres:16-alpine
    container_name: order-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka:
    image: apache/kafka:3.7.0
    container_name: order-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode: Kafka manages its own metadata and leader election itself (a Raft
      # consensus quorum formed by nodes acting as "controllers"), instead of relying on
      # an external Zookeeper ensemble -- one less moving piece to run and operate.
      # Single-node here, so this one broker plays both the broker and controller roles.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

volumes:
  postgres_data:
